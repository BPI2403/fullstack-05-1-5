services:
  # PostgreSQL — основная база данных приложения
  db:
    image: postgres:16-alpine
    container_name: finance_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - finance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI backend (схему применяет Alembic при старте контейнера)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/finance
      APP_NAME: "Личный финучёт API"
      APP_VERSION: "0.1.0"
      DEBUG: "false"
      LOG_LEVEL: "INFO"
      DB_AUTO_CREATE: "false"  # схему управляет Alembic
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  finance_db_data:
